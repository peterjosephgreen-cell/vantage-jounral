<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123f35">
<title>Vantage Journal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="authScreen" class="auth-screen">
 <div class="auth-card"><div class="auth-logo">△</div><h1>VANTAGE JOURNAL</h1><p>Shared Expedition</p>
  <form id="loginForm">
   <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
   <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
   <button class="primary wide">Sign in</button><div id="loginError" class="error"></div>
  </form>
 </div>
</div>

<div class="app">
 <aside class="sidebar">
  <div class="brand"><div class="mountain">△</div><strong>VANTAGE</strong><span>JOURNAL</span></div>
  <nav id="desktopNav"></nav>
  <div class="profile"><div class="avatar" id="profileInitial">P</div><div><strong id="profileName">Pete</strong><small id="profileRole">Owner</small></div><button id="signOutBtn" class="signout">↪</button></div>
 </aside>
 <main>
  <header><div><h1 id="pageTitle">Explore</h1><p id="pageSubtitle"></p></div>
   <div class="header-right"><span id="memberCount">👥 Vantage Expedition</span><span class="synced">● Synced</span></div>
  </header>
  <section id="content"></section>
 </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal-backdrop hidden" id="modalBackdrop">
 <div class="modal">
  <button class="close" id="closeModal">×</button>
  <div id="modalContent"></div>
 </div>
</div>

<script type="module" src="app.js"></script>
</body></html>
